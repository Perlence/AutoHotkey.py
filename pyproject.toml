[project]
name = "AutoHotkey.py"
version = "0.2"
description = "Write AutoHotkey scripts in Python."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
requires-python = ">= 3.8"
authors = [{name = "Sviatoslav Abakumov", email = "dust.harvesting@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Documentation = "https://ahkpy.readthedocs.io/en/latest/"
Changelog = "https://github.com/Perlence/AutoHotkey.py/blob/master/CHANGES.md"
"Source code" = "https://github.com/Perlence/AutoHotkey.py"
"Issue tracker" = "https://github.com/Perlence/AutoHotkey.py/issues"

[project.scripts]
ahkpy = "ahkpy.launcher:main"

[dependency-groups]
dev = [
    {include-group = "docs"},
    {include-group = "tests"},
    "flake8>=6.0.0",
    "pre-commit>=4.7.0",
    "sphinx-autobuild>=2021.3.14",
    "tox>=4.22",
    "tox-uv",
]
docs = [
    "sphinx>=6.1.3",
]
tests-min = [
    "pytest>=7.2.1",
    "pytest-mock>=3.10.0",
]
tests = [
    {include-group = "tests-min"},
    "pywinpty>=2.0.10; sys_platform == 'win32'",
]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.11"}
docs = {requires-python = ">=3.10"}

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ahkpy"
source-include = [
    "CHANGES.md",
    "tox.ini",
    "uv.lock",
    "tests/**",
    "examples/**",
    "docs/**",
]
source-exclude = ["/docs/_build", "/docs/_themes"]

[tool.flake8]
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-vv"]
